<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .inStock{
      color: green;
    }
  </style>
</head>
<body>
  <div id="product-card">
  <h2 id="product-name">Wireless Headphones</h2>
  <p id="product-price">$49.99</p>
  <p id="product-status">In Stock</p>
  <button id="toggle-stock-btn">Toggle Stock Status</button>
  <button class="delete-btn">Remove Item</button>
</div>

<script>
  // Using getElementById, select product-name, product-price, and product-status, and log all three to the console.

  let productName=document.getElementById("product-name")
  let productPrice=document.getElementById("product-price")
  let productStatus=document.getElementById("product-status")
  console.log(productName)
  console.log(productPrice)
  console.log(productStatus)

  // Using querySelector, select #product-status and use classList.add() to give it a class called in-stock (define this class in a <style> tag with color: green;).

    let productSts=document.querySelector("#product-status")
    productSts.classList.add("inStock")

    


</script>
</body>
</html>
