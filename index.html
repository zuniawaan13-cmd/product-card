<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .inStock {
        color: green;
      }

      .outStock {
        color: red;
      }
    </style>
  </head>
  <body>
    <div id="product-card">
      <h2 id="product-name">Wireless Headphones</h2>
      <p id="product-price">$49.99</p>
      <p id="product-status">In Stock</p>
      <button id="toggle-stock-btn">Toggle Stock Status</button>
      <button class="delete-btn">Remove Item</button>
      <button class="delete-btn">Remove button</button>
      <button class="delete-btn">Remove second item</button>
      <button class="delete-btn">Remove third item</button>
    </div>

    <script>
      // Using getElementById, select product-name, product-price, and product-status, and log all three to the console.

      let productName = document.getElementById("product-name");
      let productPrice = document.getElementById("product-price");
      let productStatus = document.getElementById("product-status");
      console.log(productName);
      console.log(productPrice);
      console.log(productStatus);

      // Using querySelector, select #product-status and use classList.add() to give it a class called in-stock (define this class in a <style> tag with color: green;).

      let productSts = document.querySelector("#product-status");
      productSts.classList.add("inStock");

      // Add a click event listener to toggle-stock-btn that uses classList.toggle() to switch the status text's class between in-stock (green) and out-of-stock (red — also define this in your <style> tag). Also update the actual text using textContent to say "In Stock" or "Out of Stock" depending on the current state.

      let toggleBtn = document.querySelector("#toggle-stock-btn");
      toggleBtn.addEventListener("click", () => {
        if (productSts.classList.contains("inStock")) {
          productSts.classList.remove("inStock");
          productSts.classList.add("outStock");
          productSts.textContent = "Out of stock";
        } else {
          productSts.classList.remove("outStock");
          productSts.classList.add("inStock");
          productSts.textContent = "In Stock";
        }
      });

      //  Using querySelectorAll, select all elements with class delete-btn (add a couple more delete buttons to your HTML to make this meaningful) and add a click event listener to each one using a loop, so clicking any of them changes that button's own text to "Removed" using textContent.

      let deleteBtn = document.querySelectorAll(".delete-btn");
      deleteBtn.forEach((button) => {
        button.addEventListener("click", () => {
          button.textContent = "Removed";
        });
      });

      // Using .style, make the product-price element's background color lightyellow and add some padding, directly through JavaScript (not through a CSS class), to practice the difference between .style and .classList.

       productPrice.style.backgroundColor="lightyellow"
       productPrice.style.padding="20px"

    </script>
  </body>
</html>
